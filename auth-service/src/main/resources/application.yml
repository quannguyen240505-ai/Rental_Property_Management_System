server:
  port: ${AUTH_PORT:8081}

spring:
  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

app:
  jwt:
    issuer: rental-property-auth
    secret: ${JWT_SECRET}
    expiration-minutes: 30

  bootstrap:
    owner:
      username: ${OWNER_BOOTSTRAP_USERNAME:owner}
      password: ${OWNER_BOOTSTRAP_PASSWORD:}
      email: ${OWNER_BOOTSTRAP_EMAIL:}

  role-management:
    manual-confirmation-enabled: false

  password-reset:
    frontend-url: ${RESET_FRONTEND_URL:http://localhost:4200/reset-password}
    mail-from: ${MAIL_FROM:no-reply@example.invalid}
