name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Unit Tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_only
          MYSQL_DATABASE: auth_test_db
          MYSQL_USER: auth_tester
          MYSQL_PASSWORD: ci_auth_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AUTH_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/auth_test_db?useSSL=false&allowPublicKeyRetrieval=true
      AUTH_TEST_DB_USERNAME: auth_tester
      AUTH_TEST_DB_PASSWORD: ci_auth_password_only

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify all Maven modules
        run: mvn -B -ntp -f pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
