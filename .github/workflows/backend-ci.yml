
name: Backend CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # JOB 1: Build and Unit Tests
  # ==========================================
  build-and-test:
    name: Build and Unit Tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_root_password_only
          MYSQL_DATABASE: auth_test_db
          MYSQL_USER: auth_tester
          MYSQL_PASSWORD: ci_auth_password_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_root_password_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      AUTH_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/auth_test_db?useSSL=false&allowPublicKeyRetrieval=true
      AUTH_TEST_DB_USERNAME: auth_tester
      AUTH_TEST_DB_PASSWORD: ci_auth_password_only

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify all Maven modules (Unit Tests)
        run: mvn -B -ntp -f pom.xml clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore

  # ==========================================
  # JOB 2: Property MySQL Integration Tests
  # ==========================================
  property-mysql-it:
    name: Property MySQL Integration Tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_property_root_only
          MYSQL_DATABASE: rental_property_test_db
          MYSQL_USER: property_it_ci
          MYSQL_PASSWORD: ci_property_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_property_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      PROPERTY_TEST_DB_USERNAME: property_it_ci
      PROPERTY_TEST_DB_PASSWORD: ci_property_test_only

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Property Unit and MySQL Integration Tests
        run: mvn -B -ntp -f pom.xml -pl property-service -am -Pmysql-it clean verify

      - name: Upload Property integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: property-mysql-it-reports
          path: |
            property-service/target/surefire-reports/**
            property-service/target/failsafe-reports/**
          if-no-files-found: ignore

  # ==========================================
  # JOB 3: Rental MySQL Integration Tests
  # ==========================================
  rental-mysql-it:
    name: Rental MySQL Integration Tests (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_rental_root_only
          MYSQL_DATABASE: rental_test
          MYSQL_USER: rental_tester
          MYSQL_PASSWORD: ci_rental_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci_rental_root_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      RENTAL_TEST_DB_PASSWORD: ci_rental_test_only

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Rental Unit and MySQL Integration Tests
        run: mvn -B -ntp -f pom.xml -pl rental-service -am -Pmysql-it clean verify

      - name: Upload Rental test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rental-mysql-it-reports
          path: |
            rental-service/target/surefire-reports/**
            rental-service/target/failsafe-reports/**
          if-no-files-found: ignore
