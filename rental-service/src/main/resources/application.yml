
server:
  port: 8083

spring:
  application:
    name: rental-service

  datasource:
    url: jdbc:mysql://localhost:3306/rental_rental_db
    username: ${RENTAL_DB_USERNAME}
    password: ${RENTAL_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
