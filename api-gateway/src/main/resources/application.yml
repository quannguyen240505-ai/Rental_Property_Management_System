server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            # Authentication / User Management
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**,/api/users,/api/users/**

            # Property / Room / Viewing / Room Hold
            - id: property-service
              uri: lb://PROPERTY-SERVICE
              predicates:
                - Path=/api/properties,/api/properties/**,/api/rooms,/api/rooms/**,/api/public/rooms,/api/public/rooms/**,/api/viewing-appointments,/api/viewing-appointments/**,/api/viewings,/api/viewings/**,/api/room-holds,/api/room-holds/**

            # Rental / Contracts / Tenant Profiles
            - id: rental-service
              uri: lb://RENTAL-SERVICE
              predicates:
                - Path=/api/rental-contracts,/api/rental-contracts/**,/api/contracts,/api/contracts/**,/api/tenant-profiles,/api/tenant-profiles/**,/api/extension-requests,/api/extension-requests/**,/api/move-out-requests,/api/move-out-requests/**

            # Dashboard / Reports
            - id: rental-reports
              uri: lb://RENTAL-SERVICE
              predicates:
                - Path=/api/reports/**

            # Billing / Utilities
            - id: billing-service
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/api/meter-readings,/api/meter-readings/**,/api/invoices,/api/invoices/**,/api/debts,/api/debts/**

            # Payment / Deposit Receipts
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments,/api/payments/**,/api/deposit-receipts,/api/deposit-receipts/**

            # Notification
            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications,/api/notifications/**

          # Remove untrusted internal headers
          default-filters:
            - RemoveRequestHeader=X-Service-Key
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Role
            - RemoveRequestHeader=X-Username

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true

app:
  auth:
    # Internal Auth Service connection
    base-url: ${AUTH_INTERNAL_BASE_URL:http://localhost:8081}

    # Shared internal service key
    internal-service-key: ${AUTH_INTERNAL_SERVICE_KEY}

  cors:
    frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
