
server:
  port: 8082

spring:
  application:
    name: property-service

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/rental_property_db
    username: ${PROPERTY_DB_USERNAME}
    password: ${PROPERTY_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
